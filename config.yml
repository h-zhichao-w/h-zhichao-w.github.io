# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://h-zhichao-w.github.io/"
title: Zhichao's Homepage
copyright: "© Zhichao Wang"
theme: [hugo-PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true
  minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 8

languages:
  en:
    label: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 5
        - name: Travel
          url: travel/
          weight: 8
        - name: Tags
          url: tags/
          weight: 9
        - name: Search
          url: search/
          weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Zhichao Wang's personal site with posts, projects, and notes."
  author: Zhichao Wang

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  comments: true   # giscus 评论，见 layouts/partials/comments.html 中的配置说明
  # og/分享预览图（占位，正式图做好后覆盖 static/images/og-cover.png 即可）
  images: ["images/og-cover.png"]
  # 访客足迹地图（方案见 worker/README.md，部署 Worker 后取消注释并填入地址）
  visitorMap:
    endpoint: "https://visitor-map.hansen-wong.workers.dev/"
    title: "访客足迹"
  profileMode:
    enabled: false
    title: Zhichao Wang
    imageUrl: "#"
    imageTitle: Profile photo
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Hi, I'm Zhichao."
    Content: |
      I am a graduate student from Shanghai Jiao Tong University (SJTU). I have two bachelor degrees, one from SJTU and the other from Московский Авиационный Институт (МАИ). My current research interests include combinational optimization, Reinforcement Learning (RL), and decisions with Large Language Models (LLM) and agents. I have also done some work on navigation, constellation mission planning, intention recognition of UAV swarms.


      I enjoy reading, especially detective novels. I am a loyal fan of Poirot — Agatha Christie, John Dickson Carr, Ellery Queen, and Kindaichi Kōsuke — Yokomizo Seishi. I am also keen on learning languages. I am a native Chinese speaker, fluent in English and Russian, and currently learning Japanese.


      I spend most of my life in Shanghai, but I have also lived in Russia for a year and traveled to several other cities, home and abroad. I have uploaded my travel vlogs to my Bilibili channel.


      Welcome to my homepage! Welcome to contact me for anything that interests you!
      

  socialIcons: 
    - name: github
      title: GitHub
      url: "https://github.com/h-zhichao-w"
    - name: email
      title: Email me
      url: "mailto:hansen_wong@sjtu.edu.cn"
    - name: bilibili
      title: Bilibili
      url: "https://space.bilibili.com/35778845"
    - name: telegram
      title: Telegram
      url: "https://t.me/zhichao_wang"
    - name: cv
      title: CV
      url: "https://h-zhichao-w.github.io/files/resume.pdf"

  # editPost:
  #   URL: "https://github.com/h-zhichao-w/h-zhichao-w.github.io/edit/exampleSite/content"
  #   Text: "Edit this page" # edit text
  #   appendFilePath: true # to append file path to Edit link

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

