# If your site is in 'https', then make sure your base url isn't written using 'http' otherwise your sitemap would
# contain http (as opposeed to https) URLs. This would affect Google indexing of your URLs.
baseURL: "https://h-zhichao-w.github.io/"
title: Zhichao's Homepage
copyright: "© Zhichao Wang"
theme: [hugo-PaperMod]

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 5
        - name: Tags
          url: tags/
          weight: 7
        - name: Search
          url: search/
          weight: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Zhichao Wang's personal site with posts, projects, and notes."
  author: Zhichao Wang

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: false
    title: Zhichao Wang
    imageUrl: "#"
    imageTitle: Profile photo
    # imageWidth: 120
    # imageHeight: 120
    buttons:
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  homeInfoParams:
    Title: "Hi, I'm Zhichao."
    Content: >
      I am a graduate student from Shanghai Jiao Tong University (SJTU). I have two bachelor degrees, one from SJTU and the other from Московский Аваиационный Институт (МАИ). My current research interests include combinational optimization, reinforcement learning, and application of Large Language Models (LLM). I have also done some work on navigation, constellation mission planning, intention recognition of UAV swarms.  

      I enjoy reading, especially detective novels. I am a loyal fan of Poriot - Agatha Chritie, John Dickson Carr, Ellery Queen, and Kindaichi Kōsuke - Yokomizo Seishi. I am also keen on learnign languages. I am a native Chinese speaker, fluent in English and Russian, and currently learning Japanese.

      I spend most of my life in Shanghai, but I have also lived in Russia for a year and traveled to several other cities, home and abroad. I have uploaded my travel vlogs to my Bilibili channel. 

      Welcome to my homepage! Welcome to contact me for anything that interests you!

  socialIcons: 
    - name: github
      title: GitHub
      url: "https://github.com/h-zhichao-w"
    - name: email
      title: Email me
      url: "hansen_wong@sjtu.edu.cn"
    - name: bilibili
      title: Bilibili
      url: "https://space.bilibili.com/35778845"
    - name: telegram
      title: Telegram
      url: "https://t.me/zhichao_wang"
    - name: cv
      title: CV
      url: "https://h-zhichao-w.github.io/files/Zhichao_Wang.pdf"

  editPost:
    URL: "https://github.com/h-zhichao-w/h-zhichao-w.github.io/edit/exampleSite/content"
    Text: "Edit this page" # edit text
    appendFilePath: true # to append file path to Edit link

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai

