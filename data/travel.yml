    date: 2024-04
    note: 莫斯科东南的一处皇家庄园，从 16 世纪开始营造，世界文化遗产，以古老的教堂和华丽的、童话般的复杂木质宫殿闻名，庄园整体占地面积巨大，有大片苹果树林，也有各类展馆，陈设包括古代宫殿布局、皇家用具、兵器、艺术品、皇家植物园等
  - name: 国民经济成就展
    region: 莫斯科
    lat: 55.826322
    lon: 37.637682
    category: historic
    date: 2023-10
    note: 苏联版世博会，给各个加盟共和国展示自己的成就，建筑恢弘大气，设计复杂精巧，经典的苏式“宫殿”，加盟共和国的场馆又搭配有本民族的特色元素，象征着社会主义苏联的成就和团结，大门上有著名的农场工人和妇女举起收获的麦子的雕塑，现在园区开放，各场馆都有自己的主题和展品，包括俄罗斯历史、航空航天、交通运输、电气、食品等
  - name: 宇宙征服者纪念碑
