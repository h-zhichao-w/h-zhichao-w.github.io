# 旅游足迹数据：在这里添加你标记的地点，地图页会自动更新
#
# 字段说明：
#   name     地点名称（必填）
#   lat/lon  经纬度（必填，十进制度；高德/百度坐标注意先转 WGS84）
#   category 分类（必填，见下方支持的取值；缺省为灰色的"其他"）
#   date     到访时间（可选）
#   note     一句话描述（可选）
#
# 支持的 category 取值：
#   historic   古迹建筑   shinto    神社       modern    现代建筑
#   mountain   山         river     河流       lake      湖泊
#   seaside    海滨       waterfall 瀑布       park      公园园林
#   museum     博物馆     gallery   美术馆画廊 school    学校
#   library    图书馆
#   buddhist   佛寺       taoist    道观
#   catholic   天主教堂   orthodox  东正教堂   mosque    清真寺
#   viewpoint  观景打卡   restaurant 餐厅美食  cafe      咖啡甜品
#   hotel      酒店住宿   shopping  购物街区   nightlife 演出夜生活
#   transport  交通体验
#
# 下面是示例点位，替换成你自己的足迹即可
