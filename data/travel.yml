    note: 古开封的标志性建筑，原为汴河上的桥梁，后来汴河干涸后逐渐废弃，明末被洪水淤埋，目前正在考古发掘中，在考古遗址中可以清楚看到从唐代至清代的地层，有完整的唐宋时期的河道和河堤，留下了大量的宋代至明代的建筑遗址，如地基和瓦片，河堤的石砖上有海马瑞兽图，是目前国内发现的北宋时期体量最大的石刻壁画，州桥本体目前发掘了一半（另一半在旁边的大楼地基下），桥面宽阔，可并排通行多辆马车，并且和现代道路（中山路）完全重合，证明了开封“城叠城”的布局
