    note: 莫斯科东南的一处皇家庄园，从 16 世纪开始营造，世界文化遗产，以古老的教堂和华丽的、童话般的复杂木质宫殿闻名，庄园整体占地面积巨大，有大片苹果树林，也有各类展馆，陈设包括古代宫殿布局、皇家用具、兵器、艺术品、皇家植物园等
  - name: 国民经济成就展
