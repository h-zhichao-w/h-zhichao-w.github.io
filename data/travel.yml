    category: historic
    date: 2026-10
    note: 凌霄塔上下由两个朝代修建，罕见地上下呈现不同风格；寺内有可爱的元代和明代石狮；还有“文致和主教及其同伴殉难处”石碑，纪念抗战时期正定主教座堂的教会人员为保护逃进教堂的民众，被日军绑缚、残杀并焚尸
  - name: 隆兴寺
    region: 石家庄
    lat: 38.144402
    lon: 114.576763
    category: historic
    date: 2026-10
    note: 前部建筑与造像多为北宋，后部多为明代，再往后还有一个花园；摩尼殿为正方形歇山式，四面正中各出抱厦山花，殿内四周布满精美壁画，背面有“倒坐观音”，巨幅立体镂空观音坐像，双目俯视与仰视者形成视觉互动，左足踏莲、右腿踞起，被鲁迅誉为“东方美神”；大悲阁中有北宋一体铸造的铜质千手观音，高24米；转轮藏中有巨大的木质转经轮；慈氏阁可与宋代《营造法式》完美匹配；寺内有大量石碑，包括康熙、乾隆御碑以及隋代“龙藏寺碑”
  - name: 赵云庙
    region: 石家庄
    lat: 38.147150
    lon: 114.580475
    category: historic
    date: 2026-10
    note: 赵云故里
  - name: 南仓口王家烧麦
    region: 石家庄
    lat: 38.141071
    lon: 114.565132
    category: restaurant
    date: 2026-10
    note: 很热门，牛肉烧麦好吃，还有很多河北菜也都很好吃
  - name: 马家老鸡店
    region: 石家庄
    lat: 38.141276
    lon: 114.565178
    category: restaurant
    date: 2026-10
    note: 烧鸡太太太香了
  # 保定
  - name: 直隶总督署
    region: 保定
    lat: 38.859018
    lon: 115.491105
    category: historic
    date: 2026-10
    note: 清代直隶总督署，没什么看的
  - name: 古莲花池
    region: 保定
    lat: 38.856693
    lon: 115.491785
    category: historic
    date: 2026-10
    note: 园林建筑，挺美的，里面还有清末建的直隶图书馆
  - name: 大慈阁
    region: 保定
    lat: 38.859020
    lon: 115.496411
    category: historic
    date: 2026-10
    note: 宋代佛寺，清代重修，本体很高，阁内有壁画
  - name: 淮军公所
    region: 保定
    lat: 38.855875
    lon: 115.483276
    category: historic
    date: 2026-10
    note: 淮军的祠堂和办公场所，门口挂的牌子是李鸿章祠堂；内有大戏楼，可以看保定老调（戏曲）
  - name: 保定军校纪念馆
    region: 保定
    lat: 38.865545
    lon: 115.520761
    category: museum
    date: 2026-10
    note: 现代修复，陈列比较精美，有很多老照片，能看出保定军校为中国近代军队建设贡献了大量人才
  - name: 永茂驴肉（莲池南大街总店）
    region: 保定
    lat: 38.855638
    lon: 115.493345
    category: restaurant
    date: 2026-10
    note: 排队王，驴肉火烧好吃得要命
  - name: 白家罩饼（百花路店）
    region: 保定
    lat: 38.866022
    lon: 115.469216
    category: restaurant
    date: 2026-10
    note: 清真菜加官府菜，河北非遗；牛肉罩饼、鱼香肉丝、扒肉条/扒口条、总督豆腐，超级好吃
  - name: 田记兔排
    region: 保定
    lat: 38.890791
    lon: 115.453697
    category: restaurant
    date: 2026-10
    note: 就是兔架，选的孜然味，好吃
  - name: 强生餐厅
    region: 保定
    lat: 38.889438
    lon: 115.448804
    category: restaurant
    date: 2026-10
    note: 河北菜，麻仁鸡蛋、鸡里蹦超好吃
  - name: 西大街
    region: 保定
    lat: 38.860813
    lon: 115.489690
    category: shopping
    date: 2026-10
    note: 民国风的购物街，保留着一些历史建筑。
  - name: 泰陵
    region: 保定
    lat: 39.370161
    lon: 115.344767
    category: historic
    date: 2026-10
    note: 清西陵是世界文化遗产，泰陵是雍正帝的陵寝，也是清西陵里规模最大的一座，能看出清朝全盛时期的国力。从大红门进去，神道两旁排着石像生，四周是成片的泰陵松海，神道整体有近3km，神道碑上刻着雍正（世宗宪皇帝）的庙号和完整谥号，最里面是高大的宝顶，可以上去绕着宝顶转一圈。
  - name: 崇陵
    region: 保定
    lat: 39.395290
    lon: 115.378458
    category: historic
    date: 2026-10
    note: 光绪帝的陵寝，被大规模盗掘过，现在地宫开放，可以下去看。整座陵修得比较凑合，有一部分是民国时才修完的，看着有点可怜。光绪灵柩前还有人供着歼-20 和东风-5C 的模型。
  - name: 昌西陵
    region: 保定
    lat: 39.359342
    lon: 115.323754
    category: historic
    date: 2026-10
    note: 嘉庆帝皇后的陵寝。里面有一圈回音壁，回音效果特别明显，比天坛的还好。
  - name: 慕陵
    region: 保定
    lat: 39.342540
    lon: 115.295792
    category: historic
    date: 2026-10
    note: 道光帝的陵寝。享殿全部用金丝楠木建成，直接用的原木没有上漆，一进去就能闻到明显的楠木香味（其他几座陵里则有股霉味）
  - name: 永福寺
    region: 保定
    lat: 39.380102
    lon: 115.396162
    category: buddhist
    date: 2026-10
    note: 清西陵的喇嘛寺，祭祀时会请寺里的喇嘛来念经。
  # 邯郸
  - name: 邯郸博物馆
    region: 邯郸
    lat: 36.610060
    lon: 114.517016
    category: museum
    date: 2026-10
    note: 馆藏比较丰富，最值得看的是赵国文物和东魏、北齐时期的佛像艺术。
  - name: 丛台公园
    region: 邯郸
    lat: 36.615664
    lon: 114.484812
    category: historic
    date: 2026-10
    note: 园里的武灵丛台是战国时期留下来的，据说是赵武灵王检阅军队、观看歌舞的地方。园里还有邯郸碑林（薄一波题字），东门入口有一座工农兵雕塑（林彪题字），南门有秦始皇出生地纪念馆。
  - name: 赵王城遗址公园
    region: 邯郸
    lat: 36.570519
    lon: 114.422747
    category: historic
    date: 2026-10
    note: 战国时期赵国都城的宫城遗址，分西城、东城、北城三部分，留存至今已有近三千年，历代相关的记载和诗歌很多。日占时期，日本考古学家在这里做了第一次系统性的考古发掘。现在北城已经被工业建设破坏，东城还在发掘，西城开放了一部分，城墙夯土和宫室城台都看得很清楚，也都能走上去，非常壮观，适合看日落。公园里可以租全地形车，西侧的展览馆系统地介绍了邯郸的历史变迁和考古工作。
  - name: 春满园
    region: 邯郸
    lat: 36.600947
    lon: 114.513481
    category: restaurant
    date: 2026-10
    note: 邯郸菜，招牌都是邯郸有名的菜，比如二毛烧鸡、大名五百居香肠、峰峰三下锅、武安伯延熏肉，都超级好吃，打卡还送成语酸奶。
  - name: 邯郸道
    region: 邯郸
    lat: 36.614106
    lon: 114.480444
    category: shopping
    date: 2026-10
    note: 明清时期邯郸县城的主干道，现在是商业化的购物街，还留着一些老建筑。
  # 圣彼得堡
  - name: 冬宫 (艾尔米塔什博物馆)
    region: 圣彼得堡
    lat: 59.939868
    lon: 30.314583
    category: museum
    date: 2024-06
    note: 文明 6 奇观。巨大的宫殿现用作博物馆，馆藏画作、艺术品和历史文物不计其数，比如 1812 年卫国战争将军肖像、沙皇宝座等。地下一层有大量古埃及文物，三层有亚太地区文物，其中不少展示了俄国和苏联对西夏的研究，也有从清宫掠来的珍品。宫殿本身的装修设计也是一大看点，不愧是全人类的奇观。
  - name: 艾尔米塔什总参谋部大楼
    region: 圣彼得堡
    lat: 59.938305
    lon: 30.317812
    category: museum
    date: 2024-06
    note: 冬宫广场对面的弧形大楼，现属艾尔米塔什，主要展现代艺术和帝国时期藏品，从拱门穿过去就是广场，可以复刻著名的攻打冬宫油画的视角。
  - name: 冬宫广场
    region: 圣彼得堡
    lat: 59.938991
    lon: 30.315473
    category: historic
    date: 2024-06
    note: 冬宫东南侧的广场，四周被冬宫建筑群围住。中央是亚历山大柱，为纪念 1812 年卫国战争而立，以沙皇亚历山大一世命名，高 47.5 米，是全世界最高的单体柱；柱顶是天使扶着十字架，整柱重约 600 吨，完全靠自重固定。
  - name: 冬宫花园
    region: 圣彼得堡
    lat: 59.939573
    lon: 30.311651
    category: park
    date: 2024-06
    note: 冬宫西侧贴着宫殿的小花园，夹在宫殿广场、宫殿通道和宫殿岸之间。1896 年为末代皇后亚历山德拉在私邸窗下修建，当年有高墙拦公众视线，革命后墙拆掉了，现在是看冬宫立面和河边风光的一角。
  - name: 宫殿桥
    region: 圣彼得堡
    lat: 59.941168
    lon: 30.308116
    category: viewpoint
    date: 2024-06
    note: 涅瓦河上最有名的开启桥之一，连接冬宫广场和瓦西里岛。夜里开桥很壮观，也是看冬宫和河景的好位置。
  - name: 彼得保罗要塞
    region: 圣彼得堡
    lat: 59.950143
    lon: 30.314896
    category: historic
    date: 2024-06
    note: 建在涅瓦河中央的兔子岛上，是圣彼得堡的建城起点。要塞里的彼得保罗大教堂金塔尖很显眼，罗曼诺夫王朝多数沙皇葬在这里，比如彼得一世、叶卡捷琳娜大帝。要塞里还有监狱，曾关押过政治犯
  - name: 阿芙乐尔号巡洋舰
    region: 圣彼得堡
    lat: 59.955381
    lon: 30.337901
    category: monument
    date: 2024-06
    note: 俄海军波罗的海舰队巡洋舰，曾参加日俄战争中波罗的海舰队的长途奔袭。船上铭牌纪念十月革命：“1917 年 10 月 25 日 21 点 40 分，在战时革命委员会的指令下，阿芙乐尔号巡洋舰 152 mm 主炮打响了历史性的一炮，标志着攻打冬宫的信号。”
  - name: 圣以撒大教堂
    region: 圣彼得堡
    lat: 59.934127
    lon: 30.305973
    category: orthodox
    date: 2024-06
    note: 圣彼得堡地标之一，金穹顶很大，内部镶嵌、石材装饰、宗教绘画极繁复。可以爬上柱廊俯瞰市中心和涅瓦河。
  - name: 尼古拉一世雕像
    region: 圣彼得堡
    lat: 59.932104
    lon: 30.308435
    category: monument
    date: 2024-06
    note: 圣以撒广场上的巨型骑马铜像，面向圣以撒大教堂，马仅以后两蹄着地，在当时是罕见的技术成就，浮雕记录尼古拉一世统治时期的若干事件。
  - name: 亚历山大花园
    region: 圣彼得堡
    lat: 59.936432
    lon: 30.303308
    category: park
    date: 2024-06
    note: 海军部南侧的市中心公园，1874 年开放，以亚历山大二世命名。夹在冬宫广场和参政院广场之间，园内有喷泉和名人胸像，往西可走到青铜骑士，往北看海军部金针。
  - name: 滴血救世主教堂
    region: 圣彼得堡
    lat: 59.940070
    lon: 30.328633
    category: orthodox
    date: 2024-06
    note: 建在亚历山大二世遇刺地点上的教堂，外观彩色洋葱顶，很像圣瓦西里，内部几乎全是马赛克壁画
  - name: 喀山大教堂
    region: 圣彼得堡
    lat: 59.934464
    lon: 30.324640
    category: orthodox
    date: 2024-06
    note: 涅瓦大街上的主教座堂，面向涅瓦大街的北侧设有巨大的半圆形科林斯式列柱廊，由96根柱子组成，堂内供奉喀山圣母像，库图佐夫安葬于此，广场上有他与巴克莱-德托利的纪念碑。穹顶底部一圈开着窗，阳光从那里洒进室内，并随时间慢慢挪移。当阳光打在圣幛上，反射出耀眼的金光，显得格外庄严神圣。
  - name: 国立俄罗斯博物馆
    region: 圣彼得堡
    lat: 59.938782
    lon: 30.332383
    category: museum
    date: 2024-06
    note: 俄罗斯艺术的国家馆，藏品从古罗斯圣像画到巡回画派、再到近现代都有，馆藏包括列宾《伏尔加河上的纤夫》、勃鲁洛夫《庞贝城的末日》、艾瓦佐夫斯基《第九波》等
  - name: 米哈伊洛夫城堡
    region: 圣彼得堡
    lat: 59.940735
    lon: 30.337600
    category: museum
    date: 2024-06
    note: 保罗一世因为担心刺杀而为自己修建的城堡式皇宫，通过开挖运河形成了一个四面环水的人工岛要塞，只能通过吊桥进入，独特之处在于，这个四边形建筑的每一边都采用了不同的建筑风格。保罗一世搬进来只住了约 40 天就在自己的卧室里被刺杀。后来改作工程兵学校，现属俄罗斯博物馆。南门外的街道上有一个巨大的彼得一世骑马雕像。
  - name: 法贝热博物馆
    region: 圣彼得堡
    lat: 59.934648
    lon: 30.343136
    category: museum
    date: 2024-06
    note: 展出珠宝大师法贝热的作品，有大量的珠宝类收藏品、法贝热复活节彩蛋作品，以及传统俄罗斯珐琅饰物、圣像、应用饰品及美术画作等多种藏品。其中，沙皇复活节彩蛋最为精美。
  - name: 阿尼奇科夫桥
    region: 圣彼得堡
    lat: 59.933252
    lon: 30.343384
    category: viewpoint
    date: 2024-06
    note: 涅瓦大街跨丰坦卡河的桥，四角各有一组驯马铜像，是街上很经典的打卡点。
  - name: 涅瓦大街
    region: 圣彼得堡
    lat: 59.932464
    lon: 30.349258
    category: shopping
    date: 2024-06
    note: 圣彼得堡南京路。
  - name: 中央海军博物馆
    region: 圣彼得堡
    lat: 59.929536
    lon: 30.293567
    category: museum
    date: 2024-06
    note: 俄国海军博物馆，从彼得大帝建海军一路展到近现代，有大量的模型和实物，第一展厅的大堂悬挂着俄海军几百年来击败、缴获的其他国家的海军旗帜，印象很深的是有一幅油画，在海军激战波涛汹涌之际，神父依然拿着十字架在甲板上给士兵们祈祷。我去的时候适逢日俄战争120周年，还有专题展。
  - name: 喀琅施塔得海军大教堂
    region: 圣彼得堡
    lat: 59.991756
    lon: 29.777479
    category: orthodox
    date: 2024-06
    note: 在芬兰湾的喀琅施塔得岛上，海军主堂，穹顶很高，岛本身也是历代要塞。
  - name: 夏宫 (彼得宫大宫殿)
    region: 圣彼得堡
    lat: 59.884562
    lon: 29.908845
    category: historic
    date: 2024-06
    note: 大规模的庄园宫殿，雕梁画栋，到处是贴金构件，花园很大。宫殿内部有导游讲解，有舞厅和各式房间，还有专门的“中国间”，按中国风格装修。从主体北侧出去，有一条水渠直通涅瓦湾，两侧是大量贴金人物塑像的喷泉。从宫殿出来往下看，极有视觉冲击力，足见沙俄帝国的实力。沿小路可走到涅瓦湾海边，海水清澈，海风舒服，不时有海鸥掠过，实为此生必去之地。
  - name: Александр
    region: 圣彼得堡
    lat: 59.927464
    lon: 30.311897
    category: hotel
    date: 2024-06
    note: 市中心的宾馆，房间干净整洁，服务热情到位，位于陀思妥耶夫斯基曾住过的楼里，大楼的侧面外墙写着“陀思妥耶夫斯基在这里写下了《罪与罚》”，唯一不足的是房间没有空调，夏天需要使用风扇，考虑到宾馆的地段和建筑的历史，可以接受
  - name: 游船码头
    region: 圣彼得堡
    lat: 59.936739
    lon: 30.300245
    category: viewpoint
    date: 2024-06
    note: 有多条游船路线可选，我搭乘了日落航线，先一路向西进入涅瓦湾，观赏了大海中的绝美日落，再返回游览了一圈涅瓦河，路过了俄海军总参谋部、冬宫、宫殿桥等著名景点
  - name: 尤苏波夫宫
    region: 圣彼得堡
    lat: 59.929259
    lon: 30.298479
    category: historic
    date: 2024-06
    note: 尤苏波夫亲王的宅邸，里面有配套的小剧场。室内大量用透视和阴影画出立体感的装饰。拉斯普京在这里被刺杀。
  - name: 马林斯基大剧院
    region: 圣彼得堡
    lat: 59.925393
    lon: 30.295836
    category: nightlife
    date: 2024-06
    note: 圣彼得堡的歌剧与芭蕾重镇，和莫斯科大剧院齐名。古典剧场，金碧辉煌，看一场芭蕾或歌剧很值。
  - name: Пышечка
    region: 圣彼得堡
    date: 2024-06
    lat: 59.9261813
    lon: 30.3153214
    category: restaurant
    note: 甜甜圈无敌好吃
  - name: Столовая ложка
    region: 圣彼得堡
    date: 2024-06
    lat: 59.927820
    lon: 30.311481
    category: restaurant
    note: 苏维埃式的食堂，味道不错
  - name: Easy Wine
    date: 2024-06
    region: 圣彼得堡
    lat: 59.928505
    lon: 30.312423
    category: restaurant
    note: 格鲁吉亚菜，好吃，服务很好，坐落在一个居民楼天井里，有点像老社区的艺术化改造，环境很好

  # 喀山
  - name: 喀山克里姆林宫
    region: 喀山
    lat: 55.797557
    lon: 49.107295
    category: historic
    date: 2024-03
    note: 喀山城的发源地，1552 年伊凡雷帝攻占喀山汗国后在原汗国要塞上改建成白石城堡，世界文化遗产。城内有库尔·谢里夫清真寺、天使报喜大教堂和总统府。北端最古老的一片有斜塔苏尤姆别卡塔，铁门上饰有太阳和月亮的图案；旁边的宫廷教堂现在是鞑靼斯坦国家历史博物馆，展出从伏尔加保加尔、金帐汗国、喀山汗国、鞑靼苏维埃社会主义自治共和国直到今天作为俄联邦共和国的鞑靼斯坦的历史，有复原的喀山汗王宝座、金帐汗国钱币和复制的 8 世纪突厥汗国的阙特勤碑 (作为突厥文字与国家传统的源头)。
  - name: 库尔·谢里夫清真寺
    region: 喀山
    lat: 55.798375
    lon: 49.105123
    category: mosque
    date: 2024-03
    note: 克里姆林宫里的蓝顶大清真寺，以 1552 年守城战死的伊玛目库尔·谢里夫命名，为纪念喀山建城千年于 2005 年落成。四座宣礼塔各高约 58 米，是喀山最有代表性的地标，从很远处就能看到，夜晚的蓝色穹顶更加醒目动人，可以上二层观景廊。
  - name: 斯帕斯卡亚塔 (救世主塔)
    region: 喀山
    lat: 55.796488
    lon: 49.108208
    category: historic
    date: 2024-03
    note: 克里姆林宫南端的正门塔楼，是从市中心走进克里姆林宫的主入口，上面有大钟，塔尖加上了红色五角星
  - name: 泰尼茨卡亚塔 (秘道塔)
    region: 喀山
    lat: 55.801245
    lon: 49.104142
    category: historic
    date: 2024-03
    note: 克里姆林宫北侧的塔楼，名字来自通往河边水源的秘密通道。相传 1552 年伊凡雷帝攻城后就是从这里进的城。
  - name: Собор Казанской иконы Божией Матери
    region: 喀山
    lat: 55.799311
    lon: 49.113216
    category: orthodox
    date: 2024-03
    note: 喀山教区的主教座堂，建在 1579 年发现喀山圣母像的地方，有五座半球形天蓝色穹顶，除祭坛一侧外，其余三面都是带柱廊的山墙，内里有非常精美的宗教绘画。
  - name: 鞑靼斯坦国家博物馆
    region: 喀山
    lat: 55.795735
    lon: 49.109635
    category: museum
    date: 2024-03
    note: 克里姆林宫对面的综合博物馆，前身是 1894 年开馆的喀山市立博物馆，馆舍是 19 世纪的老商场。展品是伏尔加保加尔、金帐汗国、喀山汗国、沙俄喀山省和苏维埃时期的考古和历史文物。
  - name: 鞑靼斯坦自然博物馆
    region: 喀山
    lat: 55.798498
    lon: 49.106156
    category: museum
    date: 2024-03
    note: 在克里姆林宫内 19 世纪士官学校的旧楼里，展厅主要介绍自然历史，涵盖宇宙、矿物、古生物和鞑靼斯坦的石油，互动展项很多。
  - name: Петропавловский собор
    region: 喀山
    lat: 55.793525
    lon: 49.113135
    category: orthodox
    date: 2024-03
    note: 彼得时代建筑风格的代表作，在喀山建筑里独一无二，最早是一个木制教堂，彼得大帝时代改建为石砌教堂，教堂外墙布满五彩的石雕花饰和彩绘瓷砖，屋顶是绿蓝相间的棋盘格；东北侧是一座六层、49 米高的钟楼；西边的米赫利亚耶夫宅邸是喀山现存最古老的民用建筑，彼得当年就住在这里。堂内最珍贵的是与教堂同时期的 25 米高、七层的巴洛克镀金木雕圣幛。
  - name: чак-чак 博物馆
    region: 喀山
    lat: 55.782101
    lon: 49.112404
    category: museum
    date: 2024-03
    note: 老鞑靼区一座 19 世纪商人木屋里的私人小博物馆，展示鞑靼人的生活习俗以及商人是如何把茶叶带来的，一楼可以喝茶、吃 чак-чак (一种球形的、和沙琪玛口感非常像的东西)，茶是调味茶，风味非常独特，可以买了当伴手礼
  - name: 农民宫公园
    region: 喀山
    lat: 55.801503
    lon: 49.111797
    category: park
    date: 2024-03
    note: 农民工及其附属公园，农民宫是 2010 年建成的农业部大楼，门口有一棵巨大的铜树拱门，很有现代艺术气息，公园挨着卡赞卡河和克里姆林宫北侧
  - name: 克里姆林宫滨河路
    region: 喀山
    lat: 55.802493
    lon: 49.109014
    category: viewpoint
    date: 2024-03
    note: 克里姆林宫北侧沿卡赞卡河的步道，可以从河边仰看城墙，对岸就是“锅”形的家庭中心，适合傍晚散步，有一些河滨商业，晚上比较热闹。
  - name: 喀山联邦大学
    region: 喀山
    lat: 55.790372
    lon: 49.120706
    category: school
    date: 2024-03
    note: 俄罗斯最古老的大学之一，前身为 1804 年由亚历山大一世下令创办的喀山(帝国)大学，后改名喀山国立大学，著名校友有列宁 (被开除)、托尔斯泰和罗巴切夫斯基，罗巴切夫斯基在这里创立非欧几何，并担任校长近 20 年；布特列罗夫在这里提出化学结构理论，克劳斯在这里发现了钌元素。1924 年到 2010 年，该校称为列宁国立大学/列宁喀山国立大学，2011 年由喀山多所高校合并组建喀山联邦大学。
  - name: 克里姆林宫街
    region: 喀山
    lat: 55.793642
    lon: 49.115730
    category: viewpoint
    date: 2024-03
    note: 救世主塔门外的大街，两边有各种政府机关、科研院所、历史建筑，如喀山联邦大学及其各学院 (如化学院、物理学院、罗巴切夫斯数学与力学院)、鞑靼斯坦共和国检察院、鞑靼斯坦共和国文化部、Александровский пассаж
  - name: 鲍曼街
    region: 喀山
    lat: 55.792422
    lon: 49.111534
    category: shopping
    date: 2024-03
    note: 喀山南京路，沿街有Колокольня Богоявленского собора、夏里亚宾像、喀山猫雕像和很多纪念品店，喀山猫很有名，纪念品店里的香皂特别香
  - name: 自由广场
    region: 喀山
    lat: 55.796830
    lon: 49.125189
    category: historic
    date: 2024-03
    note: 喀山的行政中心广场，有 1956 年建成的贾利勒歌剧芭蕾舞剧院和鞑靼斯坦内阁大楼，广场中间是 1954 年的列宁像。
  - name: Колокольня Богоявленского собора
    region: 喀山
    lat: 55.788273
    lon: 49.119400
    category: historic
    date: 2024-03
    note: 鲍曼街上的地标，喀山最高的钟楼，也是俄罗斯最高的东正教钟楼之一，很长一段时间都是全城最高的建筑。钟楼采用俄罗斯风格，红砖配白石，装饰有尖拱、кокошник (一种拱形装饰) 和层层的拱券饰带。塔顶有一口约 8.6 吨的大钟。1873 年夏里亚宾在这座教堂受洗，后来也在这里的唱诗班唱过歌，所以楼前立着他的雕像。可以登上塔顶，塔顶很漂亮，那天天很蓝，喀山的城市全景一览无余，特别美。
  - name: “喀山锅”家庭中心 (婚礼宫)
    region: 喀山
    lat: 55.812702
    lon: 49.108340
    category: modern
    date: 2024-03
    note: 卡赞卡河对岸造型像一口大锅的婚姻登记宫，2013 年为喀山大运会建成，造型是突厥传统的大锅，象征家庭的炉灶和团圆，鞑靼语里“喀山”就是锅的意思。建筑四角有四组雕像，两组是 Зилант (鞑靼神话中近似于龙和 dragon 的神话生物，也是喀山市的标志)，带着两只小 Зилант，两组是长翅膀的雪豹 (鞑靼斯坦的国徽动物)，带着两只小雪豹，寓意婚姻和家庭。建筑本体上也有很多 Зилант 的纹饰。
  - name: 捷尔任斯基街 22 号（青旅）
    region: 喀山
    lat: 55.793773
    lon: 49.120207
    category: hotel
    date: 2024-03
    note: 民宿，老式苏联居民楼，房子质量还不错
  - name: 黑湖公园
    region: 喀山
    lat: 55.795027
    lon: 49.117344
    category: park
    date: 2024-03
    note: 喀山最古老的城市公园，冬天会化身为大型露天溜冰场，夜晚搭配霓虹灯会非常好看，公园属于是在闹市区里的闹中取静，在冬天的晚上，积雪和灯光共同营造出一种静谧的俄式美感，难以用语言描述
  - name: 喀山火车站
    region: 喀山
    lat: 55.788633
    lon: 49.099702
    category: transport
    date: 2024-03
    note: 传奇冒险经历，详情请咨询笔者

  # 索契
  - name: 索契奥林匹克公园
    region: 索契
    lat: 43.404654
    lon: 39.955667
    category: stadium
    date: 2024-04
    note: 2014 年索契冬奥会沿海赛区主场馆群，园内有开幕式/闭幕式用的菲什特体育场（后改建承办 2018 世界杯）、Большой 冰球馆、Айсберг 花样滑冰与短道馆、Шайба 冰球馆、Ледяной куб 冰壶馆，以及原 Адлер-Арена 速滑馆（现 Сириус Арена）。中央奖牌广场有高大的奥运火炬塔和音乐喷泉，外围环绕曾办 F1 俄罗斯大奖赛的索契赛道。
  - name: 胜利 65 周年街 4 号
    region: 索契
    lat: 43.398917
    lon: 39.966694
    category: hotel
    date: 2024-04
    note: 离海边步行 5 分钟，环境非常好，能看到北侧的雪山，早餐好吃，路口有便利店，生活交通都很方便
  - name: Имеретинка 海滩
    region: 索契
    lat: 43.402575
    lon: 39.946573
    category: seaside
    date: 2024-04
    note: 靠奥林匹克公园一侧的卵石海滩，免费进入，海水很蓝，可以走进水里，很舒服
  - name: 天狼星海滩
    region: 索契
    lat: 43.398011
    lon: 39.962987
    category: seaside
    date: 2024-04
    note: 胜利 65 周年街对面一带的主海滩之一，卵石滩、海水很蓝，下水舒服，鹅卵石可以随便捡，有很多漂亮的鹅卵石；有懒人沙发和沙滩伞可租。在这里看过一次日落，非常好看，还在懒人沙发上躺着歇了一个小时。
  - name: 索契树木园
    region: 索契
    lat: 43.571351
    lon: 39.743015
    category: park
    date: 2024-04
    note: 亚热带树木园，属索契国家公园，活植物 1800 多种（含大量松、栎、棕榈）。上有日本风情园、中国小院、柏树大道、地理分区（高加索、东亚、北美、澳新等），以及孔雀、鸵鸟、鹦鹉等小动物园，另有玫瑰园、竹林、阶梯水塘（天鹅、鹈鹕）；山坡观景台可俯瞰黑海与城区。
  - name: 天狼星教育中心
    region: 索契
    lat: 43.400000
    lon: 39.964794
    category: school
    date: 2024-04
    note: 奥林匹克大道 40 号，紧邻天狼星海滩。由“天赋与成功”教育基金会创办，面向全俄在科学、艺术、体育方面有天赋的中学生，每月举办集中培训营，是天狼星大学的一部分。
  - name: 索契乐园
    region: 索契
    category: amusement
    lat: 43.404255
    lon: 39.967360
    date: 2024-04
    note: 紧挨奥林匹克公园的俄罗斯主题乐园，常被称作“俄罗斯的迪士尼”。园区以俄罗斯童话分区（勇士之地、魔法森林、科幻之地、生态村等），有大型过山车与家庭项目，园内还有海豚馆表演。园边是仿中世纪城堡的 Богатырь 酒店。
  - name: 冬季剧院
    region: 索契
    lat: 43.572356
    lon: 39.730585
    category: nightlife
    date: 2024-04
    note: 1934–1937 年建成，联邦级文物，88 根科林斯柱环绕，门楣上有“绘画”、“雕塑”、“建筑”三座雕像
  - name: Приморский 海滩
    region: 索契
    lat: 43.572597
    lon: 39.726932
    category: seaside
    date: 2024-04
    note: 市中心滨海大道旁、冬季剧院附近的市政卵石海滩，长约 700 米，免费进入。岸上是堤岸散步道，有很多咖啡店、西餐店和购物商店，海滩被多道丁坝（与海岸垂直伸进海里的混凝土岸防构筑物）分成若干小段，可一路逛到海运客运站方向
  - name: 海运客运站
    region: 索契
    lat: 43.580806
    lon: 39.718652
    date: 2024-04
    category: historic
    note: 市中心海港客运站，经典的苏式建筑，中央塔楼连不锈钢尖顶高约 71 米，雕像象征四季与方位；对面广场有航海女神喷泉。曾是黑海客运枢纽，现仍可由此乘游船游览黑海，老站房一带有餐饮与商店。
  - name: 索契火车站
    region: 索契
    date: 2024-04
    lat: 43.591286
    lon: 39.728483
    category: transport
    note: 北高加索铁路主站，帝国风格；主楼长约 145 米，旁立约 55 米钟楼，表盘直径约 5 米，外圈排布黄道十二宫。楼内有三个带雕塑与喷泉的内院，其中"持罐少女"是索契象征之一。从这里坐火车去阿德勒／天狼星方向，铁路线几乎贴着黑海海岸修，一路窗外就是黑海海景，非常漂亮，大饱眼福，坐得很爽。
  - name: 天狼星站
    region: 索契
    date: 2024-04
    lat: 43.412005
    lon: 39.973387
    category: transport
    note: 奥林匹克公园旁的火车站，冬奥前建成，出站即奥林匹克公园、索契乐园


  # 伏尔加格勒
  - name: 伏尔加格勒天文馆
    region: 伏尔加格勒
    lat: 48.714417
    lon: 44.524459
    category: museum
    date: 2024-06
    note: 1954 年 9 月 19 日开馆，是民主德国送给斯大林 70 岁寿辰的礼物，卡尔·蔡司耶拿厂的投影仪、设备和建材装了 260 多节火车车厢运来。它是苏联继莫斯科之后的第二座天文馆，星空大厅有 450 个座位，穹顶直径 25 米；26 米高的塔楼里还有一台 12 英寸的蔡司折射望远镜。门厅保留着斯大林像马赛克，馆内挂着傅科摆。
  - name: 伏尔加格勒纪念历史博物馆
    region: 伏尔加格勒
    lat: 48.711289
    lon: 44.514587
    category: museum
    date: 2024-06
    note: 火车站广场边一栋 1903 年建的红砖俄罗斯风格宅邸，原属察里津商人列普尼科夫家族。1917—1918 年察里津苏维埃的防御司令部设在这里，1937 年作为察里津保卫战博物馆开放。楼在斯大林格勒战役中受损，1948 年修复。现在是南部联邦区唯一专讲俄国内战的博物馆，展出伏罗希洛夫、布琼尼等人的遗物、白军物品、一战和内战时期的冷兵器与枪械。门口立着两座纪念碑：一座是 2014 年 8 月 4 日（一战爆发 100 周年之际）落成的“献给参加第一次世界大战的察里津人”纪念碑，花岗岩底座上是一枚青铜圣乔治十字勋章，上方展翅的是帝国双头鹰，旁边还有军大衣和莫辛步枪；另一座是全勤圣乔治骑士、苏联英雄顿河哥萨克涅多鲁博夫像。馆内有挂着马克沁机枪的机枪马车、炮舰“万尼亚共产党员号”上的 75 毫米舰炮，还有一台 1962 年由原车组成员在顿涅茨克州一家机械厂做的“第二西伯利亚号”装甲列车小模型；旁边有按 2/3 比例复原的装甲车厢剖开展示，里面摆着机枪和弹药箱，从观察孔看出去是战斗场景。
  - name: 军人纪念公墓
    region: 伏尔加格勒
    lat: 48.743548
    lon: 44.534191
    category: monument
    date: 2024-06
    note: 位于马马耶夫岗上“祖国母亲在召唤”雕像背后的山坡，占地约 5000 平方米，1995 年 5 月 8 日（胜利 50 周年前夕）启用第一期，安葬战后搜寻队陆续找到的斯大林格勒战役阵亡将士，迁葬至今仍在继续。这里有一百多座个人墓和约十座合葬墓，合葬墓里是约 2000 名无名战士。180 米长的纪念墙上方是浮雕题字“献给为胜利献出生命的你们”，墙上刻着近 2.5 万个名字。旁边有座蜡烛形的小教堂是 2006 年建的弗拉基米尔圣母像小堂。
  - name: 军人荣誉大厅
    region: 伏尔加格勒
    lat: 48.742369
    lon: 44.539056
    category: monument
    date: 2024-06
    note: 马马耶夫岗半山腰的圆形纪念厅，四周没有窗，光从顶上的圆孔照下来。圆孔直径 11 米，边缘是一圈马赛克金色花环，站在合适的位置往上看，能透过圆孔看到祖国母亲在召唤雕像的头。中央是一只从地面伸出、高举火炬的巨手，火炬上点着永恒之火。墙上环绕着一条近卫军绶带浮雕，上面刻着一整句话：“是的，我们只是凡人，我们之中很少有人幸存下来，但我们每个人都履行了对神圣祖国母亲的爱国义务！”（Да, мы были простыми смертными, и мало кто уцелел из нас, но все мы выполнили свой патриотический долг перед священной матерью-Родиной!），墙面刻满阵亡将士的名字，厅里一直回响着舒曼的《梦幻曲》。仪仗兵从 1968 年起在这里守卫，白天从 9 点起每小时换岗一次。我在永恒之火前献了花，看到卫兵正步换岗，庄严肃穆。
  - name: 伏尔加格勒希尔顿花园酒店
    region: 伏尔加格勒
    lat: 48.727219
    lon: 44.538818
    category: hotel
    date: 2024-06
    note: 位于中央区列宁大街 56А 号，为迎接 2018 年世界杯而建。往北不远就是马马耶夫岗和伏尔加格勒体育场，隔壁是欧洲城购物中心，对面是斯大林格勒胜利广场和州法院大楼，窗外能看到伏尔加河大桥。
  - name: 和平街
    region: 伏尔加格勒
    lat: 48.712434
    lon: 44.521156
    category: shopping
    date: 2024-06
    note: 由战前的罗蒙诺索夫街和萨拉托夫街合并而成，1945—1950 年重建，通常被称为斯大林格勒战后第一条重建完成的街道。“和平街”这个名字是建设者自己提议的，街道从少年宫一直通到天文馆，中间穿过阵亡战士广场；街边有 2005 年建的“爱情喷泉”。和平街与塞得港街交叉口、第 5 中学（原第 8 中学，加加林飞天五天后就以他命名）旁边，立着纪念标志《太空讲俄语！》：金属轨道环绕着一颗印有苏联地图和“12.04.1961”字样的地球，环上是“东方号”火箭。它在 2016 年 4 月 12 日航天节、加加林飞天 55 周年时揭幕；旁边的“加加林小院”里种着一棵雪松，呼应加加林的呼号“雪松”。
  - name: 圣亚历山大·涅夫斯基大教堂
    region: 伏尔加格勒
    lat: 48.709395
    lon: 44.513611
    category: orthodox
    date: 2024-06
    note: 阵亡战士广场旁公园里的东正教主教座堂。原来的教堂由捷尔利科夫设计，1901—1916 年建成，1918 年祝圣，1929 年关闭，1932 年 3 月被炸毁。现在这座新拜占庭风格的教堂参照老教堂的样子重建，建在离旧地基几米远的地方，2016 年动工，2021 年 9 月 19 日由基里尔牧首祝圣。
  - name: 巴甫洛夫大楼
    region: 伏尔加格勒
    lat: 48.715995
    lon: 44.531575
    category: historic
    date: 2024-06
    note: 列宁广场（战时叫 1 月 9 日广场）边一栋 1930 年代建的四层居民楼。1942 年 9 月 23 日至 11 月 25 日，巴甫洛夫中士带四名战士先占下这栋楼，随后阿法纳西耶夫中尉带援兵进驻并指挥防守，二三十名守军坚守了 58 天，地下室里还躲着平民，这里也就成了巷战的象征。1943 年它成为斯大林格勒最早修复的建筑之一，今天仍有人居住。楼的两侧各有一面纪念墙，苏维埃街一侧刻着“在这座楼里，战斗的功绩与劳动的功绩融为一体”。
  - name: 斯大林格勒战役全景博物馆
    region: 伏尔加格勒
    lat: 48.714930
    lon: 44.532861
    category: museum
    date: 2024-06
    note: 伏尔加河边的战役主题博物馆，建在 1942 年 9 月罗季姆采夫近卫第 13 师登陆的地方，崔可夫元帅街 47 号。屋顶圆厅里是格列科夫画室创作的全景画《德国法西斯军队在斯大林格勒的覆灭》，高 16 米、长 120 米，画的是 1943 年 1 月 26 日第 21 和第 62 集团军在马马耶夫岗会师的场面。楼下有 8 个主题展厅和 4 幅透景画，分别是《战胜死亡的坚毅》《伏尔加河中央渡口》《粉碎曼施坦因突击集团》和《夺取塔钦斯卡亚机场》。展品里轻重武器很多：第二展厅有一枚德军 FAB-1000 航空炸弹（1000 公斤级），还复原了一些当年的防御工事；讲斯大林格勒防空的展区里，有 85 毫米高射炮和一台 1939 年式 З-15-4Б 防空探照灯，透镜直径 1.5 米。第四展厅讲巷战，有长 30 米的废墟城市模型和狙击手瓦西里·扎伊采夫的步枪（他在战役中击毙约 300 名敌人），馆藏里还有“斯大林格勒之剑”。第八展厅有保卢斯被俘后在第 64 集团军司令舒米洛夫的司令部接受审讯时用的桌子。参观的最后是凯旋大厅，白色大理石墙上刻着参加战役的 229 个兵团和部队的番号，天花板上是胜利勋章图案的彩色玻璃。馆外是露天兵器陈列：有 IS-2、IS-3、T-34 等坦克和 ISU-152 自行火炮，北侧有一列纪念铁路军人的“军列”，河边有伏尔加区舰队的 BK-13 内河装甲艇。从这里望出去，伏尔加河又宽又平静，河水很蓝。
  - name: 格哈特磨坊遗址
    region: 伏尔加格勒
    lat: 48.715518
    lon: 44.532997
    category: historic
    date: 2024-06
    note: 巴甫洛夫大楼对面的一座蒸汽面粉厂残骸，伏尔加德意志人格哈特家族在 1899—1900 年建成，1907 年失火后于 1908 年用钢筋混凝土框架重建，1929 年改名格鲁季宁磨坊。斯大林格勒战役中，这里驻守着近卫第 13 师第 42 团的一个营，和巴甫洛夫大楼组成同一个防御支撑点。战后刻意没有修复，作为纪念，被炮火摧残后的样子保留至今，属于全景博物馆保护区，弹孔、弹坑清晰可见。磨坊旁边是 2013 年复制的“巴尔马列伊”喷泉：一圈孩子围着鳄鱼跳舞，仿照的是 1942 年 8 月 23 日那张有名的战地照片。
  - name: 消防瞭望塔
    region: 伏尔加格勒
    lat: 48.709791
    lon: 44.510392
    category: historic
    date: 2024-06
    note: 察里津第一消防队的红砖楼，1897 年 8 月奠基，正面嵌着“1897”字样，在伏尔加格勒是少见的带 19 世纪年份的建筑。瞭望塔高 18 俄丈（近 40 米），1899 年 10 月 22 日启用，当时是全城最高的建筑。1935 年前后塔楼被拆，楼身在斯大林格勒战役中受损后修复；2000—2001 年大修时按老照片重建了瞭望塔，立面上的察里津城徽一直保留着。
  - name: 祖国母亲在召唤
    region: 伏尔加格勒
    lat: 48.742329
    lon: 44.537094
    category: monument
    date: 2024-06
    note: 马马耶夫岗顶上的巨型雕像，武切季奇设计，1967 年 10 月 15 日落成，连剑总高 85 米，人像高 52 米，剑重 14 吨，雕像总重约 8000 吨。雕像是中空的钢筋混凝土结构，靠内部 99 根钢索维持稳定。从悲伤广场到山顶有一条盘旋的小路，路边合葬着 3 万多名战士，沿途立着 37 块花岗岩纪念石板；第一块献给无名战士，刻着“你的名字无人知晓，你的功绩永垂不朽”。走在路上抬头看，气势恢宏，震撼人心，仿佛能感受到当年保卫家国的红军战士的一腔热血，那种舍身成仁、有死之荣无生之辱的精神无上光荣。
  - name: 记忆博物馆
    region: 伏尔加格勒
    lat: 48.708743
    lon: 44.516645
    category: museum
    date: 2024-06
    note: 阵亡战士广场边中央百货商店的地下室。1943 年 1 月 31 日，苏军第 38 摩托化步兵旅在这里俘虏了德军第 6 集团军的司令部，包括刚晋升元帅的保卢斯。这里复原了保卢斯的房间和司令部作战处。
  - name: 马马耶夫岗
    region: 伏尔加格勒
    lat: 48.741595
    lon: 44.539438
    category: monument
    date: 2024-06
    note: 斯大林格勒战役中反复争夺的 102 高地，战后由武切季奇主持建成纪念建筑群，1959 年动工，1967 年 10 月 15 日落成，山体因此加高了 8 米。从山脚上去，依次经过杨树林荫道、“死守到底”广场、废墟墙、英雄广场、军人荣誉大厅和悲伤广场，最后沿盘山小路走到山顶的“祖国母亲在召唤”雕像。山上安葬着 3.5 万多名守城战士，一路都能看到纪念碑和墓石。山脚的大台阶从下往上看，台阶立面上写着“为了我们的苏维埃祖国！CCCP！”；往上走，“死守到底”广场前的台阶上还写着“为了斯大林格勒！”。从山脚到山顶共有 200 级花岗岩台阶，对应斯大林格勒战役的 200 天。2008 年它入选“俄罗斯七大奇迹”。
  - name: 胜利公园
    region: 伏尔加格勒
    lat: 48.703228
    lon: 44.518340
    category: park
    date: 2024-06
    note: 在中央滨河路（第 62 集团军滨河路）的上层台地，24 小时开放，不收门票。中轴林荫道两边是杨树和玫瑰花坛，从音乐剧院一直通到施洗约翰教堂，沿途有描绘“三个女孩在跳舞”的友谊喷泉、彼得与费芙罗尼娅像、哥萨克纪念碑和一座小礼拜堂。公园中心是一个大广场，往西是英雄林荫道，往东是通往河边的大台阶，路灯顶上是五角星和各兵种徽章，还有灯光音乐喷泉“艺术”。公园非常漂亮，有位老人在拉手风琴。
  - name: 契卡人员纪念碑
    region: 伏尔加格勒
    lat: 48.701614
    lon: 44.505913
    category: monument
    date: 2024-06
    note: 在察里察河右岸、阿斯特拉罕桥旁的契卡人员广场上，1947 年 12 月 28 日落成。17 米高的方尖碑基座顶上，是一位高举出鞘利剑的青铜契卡战士，人像高 3.85 米（连剑 5.8 米），整座纪念碑高 22 米多，四面都有台阶。碑文写着“献给 1942 年 8 月至 1943 年 2 月保卫城市时牺牲的契卡人员、斯大林格勒方面军反间谍人员、内务人民委员部第 10 师官兵和民警”；这个师在战役中获得列宁勋章，出了 20 位苏联英雄。它长期被称为世界上唯一一座献给契卡战士的纪念碑，广场在 1965 年以它命名。
  - name: 反坦克犬纪念碑
    region: 伏尔加格勒
    lat: 48.701411
    lon: 44.505286
    category: monument
    date: 2024-06
    note: 在契卡人员广场上、契卡人员纪念碑旁边，全名是“献给歼灭法西斯坦克的军犬”，2011 年 5 月 28 日边防军人节揭幕，真实大小的青铜狗形似东欧牧羊犬，背上驮着装有引信的 TNT 炸药包，连 1 米高的芬兰花岗岩基座共高 2.1 米。它纪念的是配属内务人民委员部第 10 师的第 28 独立反坦克犬分队：狗受训钻到坦克底下引爆炸药，据记载这支分队炸毁了 42 辆坦克，整个斯大林格勒战役中被反坦克犬炸毁的坦克约有 180 辆。这是俄罗斯唯一一座献给爆破犬的纪念碑。
  - name: 欧洲城购物中心
    region: 伏尔加格勒
    lat: 48.725909
    lon: 44.541563
    category: shopping
    date: 2024-06
    note: 地址是列宁大街 54Б 号，就在希尔顿花园酒店隔壁，经常在这里吃饭。
  - name: 斯大林格勒胜利广场
    region: 伏尔加格勒
    lat: 48.727543
    lon: 44.537307
    category: historic
    date: 2024-06
    note: 在列宁大街上，正对希尔顿花园酒店，位于马马耶夫岗和伏尔加河大桥之间。广场上有一栋大楼，楼顶有马克思、恩格斯、列宁三颗浮雕头像，本地人叫它“三颗头的房子”，原是 1985 年落成的政治教育之家，后来做过州爱乐乐团的音乐厅，现在是伏尔加格勒州法院。楼前的大喷泉已经停用，广场显得有些冷清，电影《零号病人》在这里取过景。
  - name: 伏尔加格勒竞技场
    region: 伏尔加格勒
    lat: 48.734464
    lon: 44.547394
    category: stadium
    date: 2024-06
    note: 位于马马耶夫岗脚下的伏尔加河岸边，建在旧中央体育场的旧址上。2014 年开工，2018 年 4 月 3 日投入使用，能容纳约 4.5 万人，高 49.5 米，外立面是倒圆台形的钢索网格，周围的步道拼成胜利勋章的五角星形状。2018 年世界杯在这里踢了 4 场小组赛，现在是“罗托尔”足球俱乐部的主场。
  - name: 伏尔加格勒新实验剧院
    region: 伏尔加格勒
    lat: 48.707751
    lon: 44.512467
    category: historic
    date: 2024-06
    note: 俄文简称 НЭТ，在和平街 5 号、阵亡战士广场旁。剧院大楼原是察里津科学与艺术之家，1915 年 12 月 20 日开幕，当年大厅有 1100 个座位，门前台阶下立着白色石狮。一战时这里做过医院，1917—1918 年察里津苏维埃设在这里，后来成为高尔基话剧院。斯大林格勒战役中楼几乎被烧空，只剩墙基，1952 年按希腊神庙式的新古典风格重建完工。1988 年高尔基话剧院被解散，同年由导演奥塔尔·詹吉舍拉什维利在这里创办新实验剧院，首演剧目是《罗密欧与朱丽叶》。
  - name: 马马耶夫岗站
    region: 伏尔加格勒
    lat: 48.737600
    lon: 44.541400
    category: transport
    date: 2024-06
    note: 伏尔加格勒市内城铁的一个停靠点，在马马耶夫岗东侧山脚下，紧挨伏尔加格勒竞技场，下车走几步就是上岗的台阶。城市电气列车从这里直通机场，从市中心到机场全程约 26 公里，大约 40 分钟。当时我在这里坐火车去机场，还有政府工作人员帮忙指路。列车出站后沿着马马耶夫岗绕了大半圈，等于绕着祖国母亲在召唤雕像转了大半圈，从车窗里能从不同角度看到她。
  - name: 伏尔加格勒国立社会师范大学
    region: 伏尔加格勒
    lat: 48.714659
    lon: 44.526508
    category: school
    date: 2024-06
    note: 俄罗斯规模较大的师范院校，学校 1931 年创办，最初叫斯大林格勒工业师范学院。斯大林格勒战役中校舍被完全摧毁，图书馆毁于战火，许多师生没能从战场回来。1943 年战役一结束就开始重建，1958 年列宁大街上的新主楼落成。1961 年城市改名，学校随之改为伏尔加格勒国立师范学院，1992 年升格为大学，2011 年改用现名。
  - name: 伏尔加格勒一站
    region: 伏尔加格勒
    lat: 48.712577
    lon: 44.513549
    category: transport
    date: 2024-06
    note: 市中心的主火车站（Волгоград-1）。1862 年这里建起第一座木结构车站，旧站房在斯大林格勒战役中严重损毁，战后另建新楼。现在的站房 1954 年启用，是典型的斯大林式建筑：三层主楼上立着带尖顶的塔楼，外墙用花岗岩和因克尔曼石，室内多用大理石。正门台阶两侧各有一块 5 米高的浮雕，左边是国内战争中的红色察里津，右边是斯大林格勒的保卫者。站前广场上有“巴尔马列伊”喷泉的复制品，六个孩子围着鳄鱼跳圆圈舞，原型就是 1942 年 8 月 23 日大轰炸后那张有名的照片。
