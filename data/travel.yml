  - name: 胜利博物馆 & 胜利公园
    region: 莫斯科
    lat: 55.730588
    lon: 37.504059
    category: museum
    date: 2023 - 2024
    note: 专门为纪念二战胜利的公园和博物馆，整体建筑肃穆庄严，通往博物馆的道路上有象征着卫国战争每一年的纪念碑，博物馆前有永恒之火，馆前耸立着一个巨大的胜利纪念碑，上面有胜利女神手持花环；场馆非常大，围绕着卫国战争的过程详细展开，有大量珍贵的史料文物，并且有逼真的造景（例如可以走到碉堡里感受炮火），并且有互动体验主题场馆（类似剧本杀，不巧我去的时候没开），最后的纪念堂里墙上刻满了苏联英雄的名字，天花板上画着卫国战争胜利勋章；也有房间纪念在战争中死去的苏联人民，这个房间灯光昏暗，天花板上挂着一串串玻璃珠，象征着为死者流下的眼泪；有一个互动装置，可以检索有记录的苏联战士，如果检索到了，那个人的照片就会从大屏幕上滚动展示的大量苏联战士的照片中飞出来，附带展示事迹
