    category: museum
    note: 日本佛教华严宗大本山、南都七大寺之一，大佛殿是世界最大的木造建筑，殿内供奉高15米以上的卢舍那大佛，南大门有很著名的双体金刚力士像，现在更重要的是作为世界文化遗产和博物馆
  
