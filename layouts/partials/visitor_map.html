{{- /* 访客足迹地图：在 config.yml 配置 params.visitorMap.endpoint 后显示 */ -}}
{{- $vm := site.Params.visitorMap }}
{{- $ep := "" }}{{ with $vm }}{{ $ep = strings.TrimRight "/" .endpoint }}{{ end }}
{{- if $ep }}
<div class="visitor-map-wrap">
    <h2 class="visitor-title">{{ $vm.title | default "访客足迹" }}</h2>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
    <div id="visitor-map" aria-label="访客足迹地图"></div>
    <p class="visitor-note">总访问量：<span id="visitor-total">—</span></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script>
    (function () {
        var el = document.getElementById('visitor-map');
        if (!el || typeof L === 'undefined') return;

        var map = L.map('visitor-map', {
            attributionControl: false,
            zoomControl: true,
            zoomSnap: 0,
            minZoom: 1,
            maxZoom: 12
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 12
        }).addTo(map);

        // 依据容器宽度计算缩放级别，使整张世界地图的宽度恰好铺满容器
        // （单份世界宽 = 256 * 2^zoom 像素）——既无左右灰边，也不重复
        function fitWorld() {
            var w = el.clientWidth;
            if (!w) return;
            map.invalidateSize(false);
            var zoom = Math.log2(w / 256);
            map.setView([10, 0], zoom, { animate: false });
        }
        fitWorld();
        window.addEventListener('resize', fitWorld);

        fetch('{{ $ep }}/locations')
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var locations = (data && data.locations) || [];
                var totalEl = document.getElementById('visitor-total');
                var total = locations.reduce(function (s, l) { return s + (l.count || 0); }, 0);
                if (totalEl) totalEl.textContent = total.toLocaleString();
                if (!locations.length) return;
                // 已有数据中可能残留未归一化的城市名（如 SG），前端兜底修正
                var CITY_ALIAS = {
                    'SG': 'Singapore', 'HK': 'Hong Kong', 'MO': 'Macau', 'TW': 'Taiwan',
                    'MY': 'Malaysia', 'TH': 'Thailand', 'ID': 'Indonesia', 'PH': 'Philippines',
                    'VN': 'Vietnam', 'JP': 'Japan', 'KR': 'South Korea', 'US': 'United States',
                    'GB': 'United Kingdom', 'DE': 'Germany', 'FR': 'France', 'AU': 'Australia',
                    'CA': 'Canada', 'BR': 'Brazil', 'IN': 'India'
                };
                // 同一城市可能因坐标不同（如 SG 与 Singapore）被后端存成多个点，
                // 这里按“归一化城市名 + 国家”合并：累加次数，坐标取次数最多的那个
                var mergedMap = {};
                locations.forEach(function (l) {
                    if (typeof l.lat !== 'number' || typeof l.lon !== 'number') return;
                    var name = CITY_ALIAS[l.city] || l.city || CITY_ALIAS[l.country] || l.country || '未知位置';
                    var key = name + '|' + (l.country || '');
                    var m = mergedMap[key];
                    if (!m) {
                        mergedMap[key] = {
                            lat: l.lat, lon: l.lon, city: name,
                            country: l.country || '', count: l.count || 0,
                            _peak: l.count || 0
                        };
                    } else {
                        m.count += l.count || 0;
                        if ((l.count || 0) > m._peak) {
                            m._peak = l.count || 0;
                            m.lat = l.lat; m.lon = l.lon;
                        }
                    }
                });
                var merged = Object.keys(mergedMap).map(function (k) { return mergedMap[k]; });
                var max = Math.max.apply(null, merged.map(function (l) { return l.count; }).concat([1]));
                merged.forEach(function (l) {
                    var radius = 3 + 5 * Math.sqrt(l.count / max);
                    L.circleMarker([l.lat, l.lon], {
                        radius: radius,
                        color: '#fff',
                        weight: 1.5,
                        fillColor: '#e07a5f',
                        fillOpacity: 0.75
                    }).addTo(map).bindPopup(
                        '<b>' + l.city + '</b><br>' +
                        (l.country ? l.country + ' · ' : '') + l.count + ' 次访问'
                    );
                });
            })
            .catch(function () { /* 统计服务不可用时静默 */ });
    })();
</script>
{{- end -}}
